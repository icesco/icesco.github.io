<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{% if page.lang == 'it' %}/it/{% else %}/{% endif %}"><span class="brand-mark">FB</span><span>Francesco Bianco</span></a>
    <nav class="site-nav" aria-label="{% if page.lang == 'it' %}Navigazione principale{% else %}Main navigation{% endif %}">
      <div class="trigger">
        {% if page.lang == "it" %}
          <a class="page-link" href="/it/progetti/">Progetti</a>
          <a class="page-link" href="/it/chi-sono/">Chi sono</a>
          <a class="page-link language-link" hreflang="en" href="{{ page.alternate_url | default: '/' }}">EN</a>
        {% else %}
          <a class="page-link" href="/projects/">Apps</a>
          <a class="page-link" href="/about/">About</a>
          <a class="page-link language-link" hreflang="it" href="{{ page.alternate_url | default: '/it/' }}">IT</a>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
