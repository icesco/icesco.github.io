<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- if page.alternate_url -%}
    <link rel="alternate" hreflang="{% if page.lang == 'it' %}en{% else %}it{% endif %}" href="{{ page.alternate_url | absolute_url }}">
  {%- endif -%}
  
  {%- if page.custom_css -%}
    <link rel="stylesheet" href="{{ "/assets/css/" | append: page.custom_css | append: ".css" | relative_url }}">
  {%- endif -%}
  
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
